[project]
name = "dog-run-ppo"
version = "0.1.0"
description = "PPO agent for dm_control dog-run"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "gymnasium>=0.28",
    "numpy>=1.24",
    "shimmy[dm-control]>=1.0",
    "packaging>=21.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
